events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    
    client_max_body_size 2G;
    
    # Use Docker internal DNS
    resolver 127.0.0.11 valid=10s ipv6=off;
    
    server {
        listen 80;
        server_name pdfglide.com www.pdfglide.com;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://pdfglide.com$request_uri;
        }
    }
    
    server {
        listen 443 ssl;
        server_name pdfglide.com www.pdfglide.com;
        
        ssl_certificate /etc/letsencrypt/live/pdfglide.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pdfglide.com/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        
        location /api {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;
            client_max_body_size 2G;
        }
        
        location /health {
            set $backend http://backend:8000;
            proxy_pass $backend/health;
        }
        
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
