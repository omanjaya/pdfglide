worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ===========================================
    # PERFORMANCE
    # ===========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # ===========================================
    # COMPRESSION
    # ===========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    # ===========================================
    # SECURITY - DDoS Protection
    # ===========================================

    # Limit request zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # Limit connection zones
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_zone $server_name zone=conn_per_server:10m;

    # Rate limit response
    limit_req_status 429;
    limit_conn_status 429;

    # ===========================================
    # SECURITY - Hide server info
    # ===========================================
    server_tokens off;
    # Note: Server header hiding requires headers-more module (use nginx-extras image)
    # Proxy headers will be cleared via proxy_hide_header

    # ===========================================
    # SECURITY - Block bad bots and scanners
    # ===========================================
    map $http_user_agent $bad_bot {
        default 0;
        ~*^$ 1;
        ~*(havij|libwww-perl|wget|python-urllib|nikto|scan|winhttp|clshttp|loader) 1;
        ~*(HTTrack|clshttp|archiver|loader|email|harvest|extract|grab|miner) 1;
        ~*(sqlmap|nmap|nikto|wikto|sfmap|bsqlbf|w3af|acunetix|havij) 1;
    }

    # Block bad referers
    map $http_referer $bad_referer {
        default 0;
        ~*(babes|forsale|girl|jewelry|love|nuede|organic|poker|porn|sex|teen) 1;
    }

    # ===========================================
    # LOGGING
    # ===========================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ===========================================
    # FILE UPLOAD LIMIT
    # ===========================================
    client_max_body_size 2G;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ===========================================
    # UPSTREAM BACKENDS
    # ===========================================
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ===========================================
    # HTTP -> HTTPS Redirect
    # ===========================================
    server {
        listen 80;
        server_name pdfglide.com www.pdfglide.com;

        # Allow ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Block bad bots
        if ($bad_bot) {
            return 444;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://pdfglide.com$request_uri;
        }
    }

    # ===========================================
    # MAIN HTTPS SERVER
    # ===========================================
    server {
        listen 443 ssl http2;
        server_name pdfglide.com www.pdfglide.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/pdfglide.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pdfglide.com/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # ===========================================
        # SECURITY HEADERS
        # ===========================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://pagead2.googlesyndication.com https://www.googletagservices.com https://adservice.google.com https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pagead2.googlesyndication.com https://www.google.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://pdfglide.com https://pagead2.googlesyndication.com https://www.google-analytics.com; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; frame-ancestors 'self'; worker-src 'self' blob:;" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Connection limits per IP
        limit_conn conn_per_ip 50;
        limit_conn conn_per_server 1000;

        # Block bad bots and referers
        if ($bad_bot) {
            return 444;
        }
        if ($bad_referer) {
            return 444;
        }

        # Block common attack patterns
        location ~* "(eval\(|base64_|<script|javascript:|vbscript:|onload=|onerror=)" {
            return 444;
        }

        # ===========================================
        # API ENDPOINTS
        # ===========================================
        location /api {
            # Rate limiting for API
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts for large file processing
            proxy_read_timeout 600s;
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;

            # Large file uploads
            client_max_body_size 2G;

            # Disable buffering for file uploads
            proxy_request_buffering off;
        }

        # File upload endpoint - stricter rate limit
        location ~ ^/api/v1/(pdf|image|document|ocr)/ {
            limit_req zone=upload burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_read_timeout 600s;
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;
            client_max_body_size 2G;
            proxy_request_buffering off;
        }

        # Health check - no rate limit
        location /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ===========================================
        # FRONTEND
        # ===========================================
        location / {
            limit_req zone=general burst=30 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Static files caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Block access to sensitive files
        location ~ /\. {
            deny all;
        }

        location ~ ^/(\.env|\.git|\.htaccess|\.htpasswd) {
            deny all;
        }
    }
}
