version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pdfglide-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdfglide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-pdfglide}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdfglide}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pdfglide-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdfglide-backend
    restart: always
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pdfglide}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-pdfglide}
      - STORAGE_PATH=/app/storage
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-104857600}
      - FILE_EXPIRY_MINUTES=${FILE_EXPIRY_MINUTES:-5}
      - DELETE_AFTER_DOWNLOAD=${DELETE_AFTER_DOWNLOAD:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-1000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pdfglide-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
    container_name: pdfglide-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pdfglide-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pdfglide-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pdfglide-network

volumes:
  postgres_data:
  backend_storage:

networks:
  pdfglide-network:
    driver: bridge
