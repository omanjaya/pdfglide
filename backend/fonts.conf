<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  PDFGlide: map font families that Office documents ask for (but that cannot
  be shipped in the image) to the closest installed, metric-compatible or
  visually similar family. Installed as /etc/fonts/conf.d/59-pdfglide-office.conf.

  Exact metric clones (text keeps identical line breaks / page breaks):
    Arial -> Liberation Sans / Arimo, Times New Roman -> Liberation Serif / Tinos,
    Courier New -> Liberation Mono / Cousine, Arial Narrow -> Liberation Sans Narrow,
    Calibri -> Carlito, Cambria -> Caladea
  (these are also covered by Debian's 30-metric-aliases.conf; repeated here so the
  behaviour does not depend on the base image.)

  Approximations (same classification, similar widths, NOT exact):
    everything else below.
-->
<fontconfig>
  <!-- Metric-compatible clones -->
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family><family>Arimo</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Microsoft Sans Serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial Narrow</family><prefer><family>Liberation Sans Narrow</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family><family>Tinos</family></prefer></alias>
  <alias binding="same"><family>Times</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Liberation Mono</family><family>Cousine</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>

  <!-- Sans-serif approximations -->
  <alias binding="same"><family>Tahoma</family><prefer><family>Tahoma</family><family>DejaVu Sans Condensed</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Selawik</family><family>Open Sans</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Light</family><prefer><family>Selawik</family><family>Open Sans</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Semibold</family><prefer><family>Selawik</family><family>Open Sans</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Trebuchet MS</family><prefer><family>Open Sans</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Candara</family><prefer><family>Open Sans</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Corbel</family><prefer><family>Open Sans</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Franklin Gothic Book</family><prefer><family>Open Sans</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Lucida Sans</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Lucida Sans Unicode</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Lucida Grande</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Century Gothic</family><prefer><family>URW Gothic</family></prefer></alias>
  <alias binding="same"><family>Avant Garde</family><prefer><family>URW Gothic</family></prefer></alias>
  <alias binding="same"><family>Comic Sans MS</family><prefer><family>Comic Neue</family></prefer></alias>

  <!-- Serif approximations -->
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family><family>Noto Serif</family><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>Constantia</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Garamond</family><prefer><family>EB Garamond</family></prefer></alias>
  <alias binding="same"><family>Book Antiqua</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Palatino Linotype</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Palatino</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Bookman Old Style</family><prefer><family>URW Bookman</family></prefer></alias>
  <alias binding="same"><family>Bookman</family><prefer><family>URW Bookman</family></prefer></alias>
  <alias binding="same"><family>Century Schoolbook</family><prefer><family>C059</family></prefer></alias>
  <alias binding="same"><family>New Century Schoolbook</family><prefer><family>C059</family></prefer></alias>

  <!-- Monospace approximations -->
  <alias binding="same"><family>Consolas</family><prefer><family>Inconsolata</family><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Lucida Console</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Andale Mono</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>

  <!-- CJK: Chinese -->
