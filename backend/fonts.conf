  <alias binding="same"><family>NSimSun</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>SimHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>黑体</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>KaiTi</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>FangSong</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>微软雅黑</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>DengXian</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>PingFang SC</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft JhengHei</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>PMingLiU</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="same"><family>MingLiU</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <!-- CJK: Japanese -->
  <alias binding="same"><family>MS Mincho</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>MS PMincho</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>MS Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>MS PGothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Meiryo</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Yu Mincho</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>Hiragino Kaku Gothic Pro</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <!-- CJK: Korean -->
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Gulim</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Dotum</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Batang</family><prefer><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>Gungsuh</family><prefer><family>Noto Serif CJK KR</family></prefer></alias>

  <!-- Thai -->
  <alias binding="same"><family>Angsana New</family><prefer><family>Noto Serif Thai</family></prefer></alias>
  <alias binding="same"><family>AngsanaUPC</family><prefer><family>Noto Serif Thai</family></prefer></alias>
  <alias binding="same"><family>Cordia New</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>CordiaUPC</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>Browallia New</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>BrowalliaUPC</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>TH Sarabun New</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>Leelawadee UI</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>Leelawadee</family><prefer><family>Noto Sans Thai</family></prefer></alias>

  <!-- Arabic / Hebrew / Indic -->
  <alias binding="same"><family>Traditional Arabic</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Simplified Arabic</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Arabic Typesetting</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Sakkal Majalla</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Mangal</family><prefer><family>Noto Sans Devanagari</family></prefer></alias>
  <alias binding="same"><family>Kokila</family><prefer><family>Noto Serif Devanagari</family></prefer></alias>
  <alias binding="same"><family>Aparajita</family><prefer><family>Noto Sans Devanagari</family></prefer></alias>
  <alias binding="same"><family>Utsaah</family><prefer><family>Noto Sans Devanagari</family></prefer></alias>
  <alias binding="same"><family>Nirmala UI</family><prefer><family>Noto Sans Devanagari</family></prefer></alias>
  <alias binding="same"><family>Latha</family><prefer><family>Noto Sans Tamil</family></prefer></alias>
  <alias binding="same"><family>Vrinda</family><prefer><family>Noto Sans Bengali</family></prefer></alias>
  <alias binding="same"><family>Shruti</family><prefer><family>Noto Sans Gujarati</family></prefer></alias>
  <alias binding="same"><family>Raavi</family><prefer><family>Noto Sans Gurmukhi</family></prefer></alias>
  <alias binding="same"><family>Gautami</family><prefer><family>Noto Sans Telugu</family></prefer></alias>
  <alias binding="same"><family>Tunga</family><prefer><family>Noto Sans Kannada</family></prefer></alias>
  <alias binding="same"><family>Kartika</family><prefer><family>Noto Sans Malayalam</family></prefer></alias>

  <!-- Last-resort fallbacks for scripts the requested font does not cover -->
  <alias><family>sans-serif</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>serif</family><accept><family>Noto Serif CJK SC</family></accept></alias>
</fontconfig>
