services:
  # PostgreSQL Database (internal only - no public port)
  postgres:
    image: postgres:16-alpine
    container_name: fileforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pdfglide}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SECURITY: Removed public port - only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Queue and Caching (internal only - no public port)
  redis:
    image: redis:7-alpine
    container_name: fileforge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redisSecure2026}
    volumes:
      - redis_data:/data
    # SECURITY: Removed public port - only accessible within Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisSecure2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend (API Server)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fileforge-backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-false}
      # Database - using Docker internal network
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      # Security - API Key (optional in development, set for production)
      - API_KEY=${API_KEY:-}
      # Storage
      - STORAGE_PATH=/app/storage
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-2147483648}
      - FILE_EXPIRY_MINUTES=5
      - DELETE_AFTER_DOWNLOAD=true
      # Rate limiting
      - RATE_LIMIT_PER_MINUTE=60
      - RATE_LIMIT_PER_HOUR=1000
      # Celery & Redis
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/1
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/2
      - ENABLE_ASYNC_PROCESSING=true
      # Parallel processing for large files
      - PARALLEL_PROCESSING_THRESHOLD=52428800
      - PARALLEL_CHUNK_PAGES=50
      # AI Services (Z.ai)
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_MODEL=${ZAI_MODEL:-glm-4.6v-flash}
    volumes:
      - backend_storage:/app/storage
      # DEV: Mount source code for hot reload
      - ./backend/app:/app/app:ro
    # DEV: Expose port for local development (remove in production)
    ports:
      - "8000:8000"
    # DEV: Enable hot reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # Celery Worker - PDF Heavy Operations (compress, merge large files)
  celery-worker-pdf-heavy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fileforge-worker-pdf-heavy
    restart: unless-stopped
    command: celery -A app.core.celery_app worker -Q pdf-heavy -c 2 --loglevel=info --max-memory-per-child=2000000
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - STORAGE_PATH=/app/storage
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/1
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/2
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # Celery Worker - PDF Light Operations (rotate, split, metadata)
  celery-worker-pdf-light:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fileforge-worker-pdf-light
    restart: unless-stopped
    command: celery -A app.core.celery_app worker -Q pdf-light,default -c 8 --loglevel=info --max-memory-per-child=500000
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - STORAGE_PATH=/app/storage
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/1
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/2
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Celery Worker - Image Operations
  celery-worker-image:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fileforge-worker-image
    restart: unless-stopped
    command: celery -A app.core.celery_app worker -Q image -c 4 --loglevel=info --max-memory-per-child=1000000
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - STORAGE_PATH=/app/storage
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/1
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/2
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M

  # Celery Worker - Document Operations (Word, Excel, PPT conversion)
  celery-worker-document:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fileforge-worker-document
    restart: unless-stopped
    command: celery -A app.core.celery_app worker -Q document -c 2 --loglevel=info --max-memory-per-child=1500000
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - STORAGE_PATH=/app/storage
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/1
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/2
      # AI Services (Z.ai) - needed for PDF to Word AI conversion
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_MODEL=${ZAI_MODEL:-glm-4.6v-flash}
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M

  # Flower - Celery Monitoring UI
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fileforge-flower
    restart: unless-stopped
    command: celery -A app.core.celery_app flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redisSecure2026}@redis:6379/1
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
    # SECURITY: Port removed - use SSH tunnel for monitoring
    depends_on:
      - redis

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: fileforge-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    # DEV: Expose port for local development
    ports:
      - "3000:3000"
    # DEV: Mount source code for hot reload
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: fileforge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.ssl.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  backend_storage:
  redis_data:
