name: Backend tests

on:
  push:
  pull_request:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      # Only what the tests exercise. LibreOffice is NOT installed: the tests that
      # need it skip themselves (see tests/conftest.py: require_soffice).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript poppler-utils libmagic1 tesseract-ocr

      # Skip the multi-GB / browser / JVM packages. They are imported lazily by
      # the app, and the tests never need them (checked locally by blocking
      # their import; not checked on a runner).
      - name: Python dependencies
        run: |
          grep -viE '^(surya-ocr|rembg|onnxruntime|playwright|weasyprint|flower|jpype1|tabula-py)' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install --upgrade pip
          # constraints.txt: the exact versions production runs.
          # greenlet: needed by SQLAlchemy's asyncio layer; in the full image it
          # arrives through playwright, which is filtered out above.
          pip install -r /tmp/requirements-ci.txt greenlet -c constraints.txt

      # Scoped on purpose: the full rule set in pyproject.toml reports ~1100
      # pre-existing findings. This only catches syntax errors and undefined names.
      - name: Ruff (errors only)
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests
